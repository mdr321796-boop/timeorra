<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>TIMORA – Make Every Moment Count.</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#f1eaff;--bg2:#d8c6ff;--card:rgba(255,255,255,.6);--text:#2a1650;--muted:#6b5a8f;--acc:#7c3aed;--acc2:#a855f7;--line:rgba(124,58,237,.28);--green:#15803d;--inp:rgba(255,255,255,.75)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#120926;--bg2:#2d1366;--card:rgba(255,255,255,.08);--text:#f3ecff;--muted:#b9a6e6;--line:rgba(190,150,255,.28);--green:#4ade80;--inp:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--bg1:#120926;--bg2:#2d1366;--card:rgba(255,255,255,.08);--text:#f3ecff;--muted:#b9a6e6;--line:rgba(190,150,255,.28);--green:#4ade80;--inp:rgba(255,255,255,.08)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 0,var(--bg2),transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2));background-color:var(--bg1);overflow-x:hidden}
#wrap{max-width:900px;margin:0 auto;padding:12px 14px 90px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.logo b{font-size:24px;letter-spacing:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}.logo small{display:block;color:var(--muted);font-size:11px}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
nav button{white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 12px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(124,58,237,.18),inset 0 1px 0 rgba(255,255,255,.25)}
h2,h3{margin:0 0 10px}h2{font-size:21px}h3{font-size:16px}.m{color:var(--muted);font-size:13px}
button,select,input,textarea{font:inherit;color:var(--text)}
input,select,textarea{background:var(--inp);border:1px solid var(--line);border-radius:12px;padding:9px 11px;max-width:100%}
input[type=checkbox]{width:auto}textarea{width:100%;resize:vertical}
.in{width:100%;margin:4px 0 10px;display:block}
button{border:1px solid var(--line);background:var(--inp);border-radius:12px;padding:8px 13px;cursor:pointer}
button.p{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;box-shadow:0 4px 18px rgba(168,85,247,.45)}
button.act{border-color:var(--acc);box-shadow:0 0 0 2px var(--line)}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.row{border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px;background:var(--inp)}
.r1,.r2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.r2{margin-top:8px;font-size:13px;color:var(--muted)}
.n{width:24px;text-align:center;color:var(--muted)}.nm{flex:1 1 140px;min-width:0}
.r2 input[type=number]{width:62px}
.row.on .t,.row.on .d,.row.on .tv,.row.on .dv{color:var(--green);font-weight:600}
.sw{position:relative;display:inline-block;width:46px;height:26px}.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+i{background:linear-gradient(135deg,var(--acc),var(--acc2))}.sw input:checked+i:after{left:23px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.lr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.lr:last-child{border:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--acc);color:#fff;padding:9px 16px;border-radius:99px;display:none;z-index:50;max-width:90vw}
#ov{position:fixed;inset:0;background:rgba(20,5,50,.82);display:none;place-items:center;z-index:60;text-align:center;color:#fff;padding:20px}
#ov div{animation:pl 1s infinite alternate}#ov h1{font-size:34px;margin:6px 0}
@keyframes pl{to{transform:scale(1.06)}}
header{flex-wrap:wrap}nav{max-width:100%}.net{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:12px;white-space:nowrap}.net i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}.net.off i{background:#f59e0b;box-shadow:0 0 8px #f59e0b}
@media(max-width:600px){#wrap{padding-bottom:20px}}
</style></head><body><div id="wrap"><header><div class="logo"><b>TIMORA</b><small>Make Every Moment Count.</small></div><span id="net" class="net" role="status" aria-live="polite"><i></i><span>Online</span></span><nav id="nav"></nav></header><main id="app"></main></div><div id="toast"></div><input type="file" id="upf" hidden accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac"><input type="file" id="pf" hidden accept="image/jpeg,image/png,image/webp"><div id="ov"><div><div style="font-size:60px">⏰</div><h1 id="oa"></h1><p id="ot"></p><button class="p" data-a="stop" style="font-size:18px;padding:12px 30px">Dismiss</button></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4),sleep=ms=>new Promise(r=>setTimeout(r,ms));
let DB={users:[],routines:[],session:null,fired:{}};try{DB=Object.assign(DB,JSON.parse(localStorage.getItem('timora')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('timora',JSON.stringify(DB))}catch(e){toast('Storage unavailable')}};
const me=()=>DB.users.find(u=>u.id===DB.session),S=()=>({h24:false,sound:true,vib:true,tone:'sine',...(me()?.set||{})});
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(()=>t.style.display='none',2600)};
async function hash(p,s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const fmt=t=>{if(!/^\d\d:\d\d$/.test(t||''))return'--';if(S().h24)return t;const[h,m]=t.split(':').map(Number);return((h%12)||12)+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM')};
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const CATS=['Fitness','Study','Health','Work','Daily','Custom'];
const TPL=[['Fitness Routine','Fitness','06:00 Wake up|06:30 Warm-up|07:00 Workout|08:00 Protein breakfast|18:00 Evening walk|21:30 Stretch'],['Gym Routine','Fitness','05:30 Pre-workout snack|06:15 Gym session|08:00 Shower|08:30 Post-workout meal|22:00 Sleep prep'],['Exam Preparation','Study','06:00 Wake up|07:00 Revise hard topics|10:00 Practice papers|13:00 Lunch|15:00 Review mistakes|20:00 Light revision|22:30 Sleep'],['Student Routine','Study','06:30 Wake up|08:00 Classes|13:00 Lunch|15:00 Homework|18:00 Play / exercise|21:00 Reading'],['Study Routine','Study','07:00 Deep focus block|09:00 Break|09:15 Focus block 2|12:00 Lunch|16:00 Revision'],['Healthy Lifestyle','Health','06:30 Wake up & water|07:30 Healthy breakfast|12:30 Balanced lunch|17:30 Exercise|19:30 Light dinner|22:30 Sleep'],['Office / Work Routine','Work','07:30 Commute|09:00 Start work|11:00 Stand & stretch|13:00 Lunch|15:30 Review tasks|17:30 Wrap up'],['Morning Routine','Daily','06:00 Wake up|06:10 Hydrate|06:30 Exercise|07:15 Shower|07:45 Breakfast|08:15 Plan the day'],['Night Routine','Daily','20:30 Tidy up|21:30 Screens off|22:00 Skincare|22:15 Read|22:45 Sleep'],['Custom Routine','Custom','09:00 First activity|12:00 Second activity']];
const mkAct=(n='',t='',o=true)=>({id:uid(),name:n,time:t,on:o,dur:30,rings:5,vib:true,sound:'default',vol:80});
let ED=null,AU='login',RING=null,AC=null;
const myR=()=>DB.routines.filter(r=>r.owner===DB.session),user=id=>DB.users.find(u=>u.id===id);
const canView=r=>r&&(r.vis==='public'||r.owner===DB.session);
// ---------- views
const V={
auth(){const reg=AU==='register',rst=AU==='reset';return`<div class="card" style="max-width:420px;margin:20px auto"><h2>${rst?'Reset password':reg?'Create account':'Welcome back'}</h2>${reg?'<label>Display name<input class="in" id="f_n" maxlength="40"></label>':''}<label>Email<input class="in" id="f_e" type="email" autocomplete="email"></label><label>${rst?'New password':'Password'} (min 8)<input class="in" id="f_p" type="password" autocomplete="${reg||rst?'new':'current'}-password"></label>${reg||rst?`<label>Recovery phrase<input class="in" id="f_r" placeholder="${reg?'Used to reset your password':'Your recovery phrase'}"></label>`:''}<button class="p" data-a="${AU}" style="width:100%">${rst?'Reset password':reg?'Register':'Log in'}</button><div class="bar" style="justify-content:center"><button data-a="m-login">Log in</button><button data-a="m-register">Register</button><button data-a="m-reset">Forgot?</button></div><p class="m">Accounts are stored in this browser only (see notes in Settings).</p></div>`},
home(){const u=me(),rs=myR(),now=new Date(),nm=now.getHours()*60+now.getMinutes(),all=rs.flatMap(r=>r.acts.map(a=>({...a,r:r.name}))).filter(a=>a.time);
const up=all.map(a=>({...a,d:(mins(a.time)-nm+1440)%1440})).sort((a,b)=>a.d-b.d).slice(0,5);
const miss=all.filter(a=>{const d=(nm-mins(a.time)+1440)%1440;return a.on&&d>2&&d<=180&&!DB.fired[a.id+'|'+dk(new Date(now-d*6e4))]});
return`<div class="card"><h2>Hello, ${esc(u.name)} 👋</h2><p class="m">${now.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})} · Make every moment count.</p><button class="p" data-a="nav" data-t="create">+ Create routine</button></div>
<div class="card"><h3>Upcoming activities</h3>${up.length?up.map(a=>`<div class="lr"><span>${esc(a.name)} <span class="m">· ${esc(a.r)}</span></span><b>${fmt(a.time)}</b></div>`).join(''):'<p class="m">No activities yet. Create a routine to get started.</p>'}</div>
${miss.length?`<div class="card"><h3>Missed alarms (last 3 h)</h3>${miss.map(a=>`<div class="lr"><span>${esc(a.name)}</span><b>${fmt(a.time)}</b></div>`).join('')}</div>`:''}
<div class="card"><h3>Today’s routines</h3>${rs.length?`<div class="g">${rs.map(r=>rc(r)).join('')}</div>`:'<p class="m">Every routine repeats daily.</p>'}</div>`},
templates(){return`<h2>Templates</h2><div class="g"><div class="card"><h3>Blank routine</h3><p class="m">Start from scratch.</p><button class="p" data-a="tpl" data-i="-1">Use</button></div>${TPL.map((t,i)=>`<div class="card"><h3>${t[0]}</h3><p class="m">${t[2].split('|').length} sample activities · fully editable</p><button class="p" data-a="tpl" data-i="${i}">Use template</button></div>`).join('')}</div>`},
create(){if(!ED)return V.templates();const e=ED;return`<div class="card"><h2>${e.id?'Edit':'Create'} routine</h2><label>Routine name<input class="in" id="e_n" maxlength="80" value="${esc(e.name)}"></label><label>Description (optional)<textarea id="e_d" maxlength="500" rows="2">${esc(e.desc)}</textarea></label><div class="r1"><label>Category <select id="e_c">${CATS.map(c=>`<option ${c==e.cat?'selected':''}>${c}</option>`).join('')}</select></label><label>Visibility <select id="e_v"><option value="private" ${e.vis=='private'?'selected':''}>Private</option><option value="public" ${e.vis=='public'?'selected':''}>Public</option></select></label></div></div>
<div class="card"><h3>Activities (${e.acts.length}/100)</h3>${e.acts.map((a,i)=>erow(a,i)).join('')}<div class="bar"><button data-a="add">+ Add more</button><button class="p" data-a="save">Save routine</button><button data-a="nav" data-t="routines">Cancel</button></div></div>`},
routines(){const rs=myR();return`<h2>My routines</h2><div class="bar" style="margin:0 0 12px"><button class="p" data-a="nav" data-t="templates">+ New routine</button></div>${rs.length?`<div class="g">${rs.map(r=>rc(r,1)).join('')}</div>`:'<div class="card m">No routines yet.</div>'}`},
explore(){const q=(V.q||'').toLowerCase(),c=V.c||'',rs=DB.routines.filter(r=>r.vis==='public'&&(!c||r.cat===c)&&(!q||(r.name+r.desc).toLowerCase().includes(q)));return`<h2>Explore public routines</h2><div class="card r1"><input id="x_q" placeholder="Search…" value="${esc(V.q||'')}" style="flex:1"><select id="x_c"><option value="">All categories</option>${CATS.map(k=>`<option ${k==c?'selected':''}>${k}</option>`).join('')}</select></div>${rs.length?`<div class="g">${rs.map(r=>rc(r)).join('')}</div>`:'<div class="card m">No public routines found.</div>'}`},
profile(){const u=me();return`<div class="card"><h2>Profile</h2><p class="m">${esc(u.email)} (private)</p><label>Display name<input class="in" id="p_n" maxlength="40" value="${esc(u.name)}"></label><label>Bio<textarea id="p_b" maxlength="200" rows="2">${esc(u.bio||'')}</textarea></label><button class="p" data-a="psave">Save profile</button></div><div class="card"><h3>My public routines</h3>${myR().filter(r=>r.vis=='public').map(r=>rc(r,1)).join('')||'<p class="m">None yet.</p>'}</div>`},
settings(){const s=S(),n=window.Notification?Notification.permission:'unsupported';return`<div class="card"><h2>Settings</h2><div class="lr">Time format<select id="s_f"><option value="12" ${!s.h24?'selected':''}>12-hour</option><option value="24" ${s.h24?'selected':''}>24-hour</option></select></div><div class="lr">Alarm sound<label class="sw"><input type="checkbox" id="s_s" ${s.sound?'checked':''}><i></i></label></div><div class="lr">Sound type<select id="s_t">${['sine','square','triangle','sawtooth'].map(t=>`<option ${t==s.tone?'selected':''}>${t}</option>`).join('')}</select></div><div class="lr">Vibration (global)<label class="sw"><input type="checkbox" id="s_v" ${s.vib?'checked':''}><i></i></label></div><div class="lr">Notifications: ${n}<button data-a="notif">Enable</button></div><div class="lr">Time zone<span class="m">${Intl.DateTimeFormat().resolvedOptions().timeZone}</span></div><div class="bar"><button data-a="test">Test alarm</button><button data-a="logout">Log out</button><button data-a="delacct">Delete account</button></div></div>
<div class="card"><h3>Alarm limitations</h3><p class="m">Alarms fire only while this page is open in a browser tab (screen may be off on some devices, but a suspended or closed tab cannot ring). Browsers can’t schedule exact alarms or vibrate in the background; iPhones don’t support web vibration. Reliable background alarms need native Android (AlarmManager) or server push. Alarms use your device’s local time and repeat every day.</p></div>`},
view(id){const r=DB.routines.find(x=>x.id===id);if(!canView(r))return'<div class="card">Routine not found or private.</div>';const o=user(r.owner),own=r.owner===DB.session;return`<div class="card"><h2>${esc(r.name)}</h2><p class="m">${esc(r.desc)}</p><span class="chip">${esc(r.cat)}</span> <span class="chip">${r.vis}</span> <p class="m">By ${o?`<a href="#user-${o.id}" style="color:var(--acc)">${esc(o.name)}</a>`:'unknown'} · ${new Date(r.created).toLocaleDateString()} · ${esc(r.tz||'')}</p>${r.acts.map((a,i)=>`<div class="row ${a.on?'on':''}"><div class="r1"><span class="n">${i+1}</span><b class="nm">${esc(a.name)}</b><span class="tv">${fmt(a.time)}</span><span class="dv">${a.dur}s ×${a.rings}${a.vib?' 📳':''}</span>${own?`<label class="sw"><input type="checkbox" data-a="tg" data-r="${r.id}" data-i="${i}" ${a.on?'checked':''}><i></i></label>`:''}</div></div>`).join('')}<div class="bar">${own?`<button class="p" data-a="edit" data-id="${r.id}">Edit</button><button data-a="rdel" data-id="${r.id}">Delete</button>`:DB.session?`<button class="p" data-a="copy" data-id="${r.id}">Save a copy</button>`:''}</div></div>`},
user(id){const o=user(id);if(!o)return'<div class="card">User not found.</div>';return`<div class="card"><h2>${esc(o.name)}</h2><p class="m">${esc(o.bio||'')}</p></div><div class="g">${DB.routines.filter(r=>r.owner===id&&r.vis==='public').map(r=>rc(r)).join('')}</div>`}};
const dk=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const rc=(r,own)=>`<div class="card" style="margin:0"><h3>${esc(r.name)}</h3><span class="chip">${esc(r.cat)}</span> <span class="chip">${r.vis}</span><p class="m">${r.acts.length} activities${user(r.owner)?' · '+esc(user(r.owner).name):''}</p><div class="bar"><button data-a="nav" data-t="view-${r.id}">Open</button>${own?`<button data-a="edit" data-id="${r.id}">Edit</button><button data-a="vis" data-id="${r.id}">Make ${r.vis=='public'?'private':'public'}</button>`:''}</div></div>`;
const erow=(a,i)=>`<div class="row ${a.on?'on':''}" data-i="${i}"><div class="r1"><span class="n">${i+1}</span><input class="nm" data-k="name" placeholder="Activity name" maxlength="80" value="${esc(a.name)}"><input type="time" class="t" data-k="time" value="${esc(a.time)}"><label class="sw" title="Alarm"><input type="checkbox" data-k="on" ${a.on?'checked':''}><i></i></label></div><div class="r2"><label>Ring <input type="number" class="d" data-k="dur" min="1" max="300" value="${a.dur}"> sec</label><label>Rings <input type="number" data-k="rings" min="1" max="20" value="${a.rings}"></label><label><input type="checkbox" data-k="vib" ${a.vib?'checked':''}> Vibrate</label><button data-a="up">↑</button><button data-a="dn">↓</button><button data-a="del">✕</button></div><div class="r2">${srow(a)}</div></div>`;
// ---------- router
function go(){const h=(location.hash||'#home').slice(1),[p,id]=[h.split('-')[0],h.slice(h.indexOf('-')+1)],pub=['explore','view','user','auth'];let v=p;if(!me()&&!pub.includes(p))v='auth';if(me()&&p==='auth')v='home';
const nav=me()?['home','create','routines','explore','templates','profile','settings']:['explore','auth'];
$('#nav').innerHTML=nav.map(n=>`<button data-a="nav" data-t="${n}" class="${v==n?'act':''}">${n=='auth'?'Sign in':n=='create'?'Create':n[0].toUpperCase()+n.slice(1)}</button>`).join('');
if(v==='create'&&!ED&&false)ED=null;$('#app').innerHTML=(V[v]||V.home)(id);}
addEventListener('hashchange',go);
// ---------- events
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset;initAudio();
const row=b.closest('[data-i]'),i=row?+row.dataset.i:0;
if(a==='nav'){location.hash=d.t;if(d.t==='create'&&!ED)ED=null;go()}
else if(a==='stop')stopAlarm();
else if(a.startsWith('m-')){AU=a.slice(2);go()}
else if(a==='tpl'){const t=TPL[+d.i];ED={id:null,name:t?t[0]:'',desc:'',cat:t?t[1]:'Custom',vis:'private',acts:t?t[2].split('|').map(s=>mkAct(s.slice(6),s.slice(0,5))):[mkAct(),mkAct(),mkAct(),mkAct(),mkAct()]};while(ED.acts.length<5)ED.acts.push(mkAct());location.hash='create';go()}
else if(a==='add'){if(ED.acts.length>=100)return toast('Maximum 100 activities');ED.acts.push(mkAct());go()}
else if(a==='del'){ED.acts.splice(i,1);go()}
else if(a==='up'&&i>0){[ED.acts[i-1],ED.acts[i]]=[ED.acts[i],ED.acts[i-1]];go()}
else if(a==='dn'&&i<ED.acts.length-1){[ED.acts[i+1],ED.acts[i]]=[ED.acts[i],ED.acts[i+1]];go()}
else if(a==='save'){const e=ED;e.name=e.name.trim();const acts=e.acts.filter(x=>x.name.trim()||x.time);if(!e.name)return toast('Routine name is required');if(!acts.length)return toast('Add at least one activity');if(acts.length>100)return toast('Maximum 100 activities');for(const x of acts){if(!x.name.trim()||!/^\d\d:\d\d$/.test(x.time))return toast('Each activity needs a name and a time');x.name=x.name.trim().slice(0,80);x.dur=Math.min(300,Math.max(1,+x.dur||30));x.rings=Math.min(20,Math.max(1,+x.rings||5));x.vol=Math.min(100,Math.max(0,+(x.vol??80)));x.sound=String(x.sound||'default');if(x.sound.startsWith('up:')&&!UP.some(q=>'up:'+q.id===x.sound))x.sound='default';if(!x.sound.startsWith('up:')&&!BI[x.sound])x.sound='default'}
if(e.id){const r=DB.routines.find(x=>x.id===e.id&&x.owner===DB.session);if(!r)return;Object.assign(r,{name:e.name,desc:e.desc,cat:e.cat,vis:e.vis,acts})}else DB.routines.push({id:uid(),owner:DB.session,name:e.name,desc:e.desc.slice(0,500),cat:e.cat,vis:e.vis,acts,created:Date.now(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone});save();ED=null;toast('Routine saved');location.hash='routines';go()}
else if(a==='edit'){const r=DB.routines.find(x=>x.id===d.id&&x.owner===DB.session);if(!r)return;ED=JSON.parse(JSON.stringify(r));location.hash='create';go()}
else if(a==='rdel'){if(confirm('Delete this routine?')){DB.routines=DB.routines.filter(x=>!(x.id===d.id&&x.owner===DB.session));save();location.hash='routines';go()}}
else if(a==='vis'){const r=DB.routines.find(x=>x.id===d.id&&x.owner===DB.session);if(r){r.vis=r.vis=='public'?'private':'public';save();go()}}
else if(a==='copy'){const r=DB.routines.find(x=>x.id===d.id);if(!canView(r))return;DB.routines.push({...JSON.parse(JSON.stringify(r)),id:uid(),owner:DB.session,vis:'private',created:Date.now(),acts:r.acts.map(x=>({...x,id:uid(),sound:String(x.sound||'').startsWith('up:')?'default':(x.sound||'default')}))});save();toast('Copied to My routines')}
else if(a==='psave'){const u=me();u.name=($('#p_n').value.trim()||u.name).slice(0,40);u.bio=$('#p_b').value.slice(0,200);save();toast('Profile saved')}
else if(a==='logout'){DB.session=null;save();location.hash='auth';go()}
else if(a==='delacct'){if(confirm('Delete your account and all routines?')){delAudioFor(DB.session);DB.routines=DB.routines.filter(r=>r.owner!==DB.session);DB.users=DB.users.filter(u=>u.id!==DB.session);DB.session=null;save();location.hash='auth';go()}}
else if(a==='notif'){if(!window.Notification)return toast('Not supported here');await Notification.requestPermission();go()}
else if(a==='test')ring({name:'Test alarm',time:'',dur:3,rings:2,vib:true});
else if(['login','register','reset'].includes(a)){const em=($('#f_e').value||'').trim().toLowerCase(),pw=$('#f_p').value,rec=$('#f_r')?.value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(em))return toast('Enter a valid email');if(a!=='login'&&pw.length<8)return toast('Password must be 8+ characters');if(a==='login'&&!pw)return toast('Enter your password');
let u=DB.users.find(x=>x.email===em);
if(a==='register'){if(u)return toast('Email already registered');if(!rec||rec.length<4)return toast('Recovery phrase: 4+ characters');const salt=uid()+uid();u={id:uid(),email:em,salt,hash:await hash(pw,salt),rh:await hash(rec,salt),name:($('#f_n').value.trim()||em.split('@')[0]).slice(0,40),bio:'',set:{},created:Date.now(),username:mkUname(em)};DB.users.push(u)}
else if(a==='reset'){if(!u||u.rh!==await hash(rec||'',u.salt))return toast('Email or recovery phrase incorrect');u.hash=await hash(pw,u.salt)}
else if(!u||u.hash!==await hash(pw,u.salt))return toast('Invalid email or password');
DB.session=u.id;save();await loadUP();location.hash='home';go()}});
document.addEventListener('input',e=>{const t=e.target,row=t.closest('[data-i]');if(row&&t.dataset.k&&ED){const a=ED.acts[+row.dataset.i];const v=t.type==='checkbox'?t.checked:t.value;a[t.dataset.k]=v;if(t.dataset.k==='on')row.classList.toggle('on',v)}
else if(ED&&t.id==='e_n')ED.name=t.value;else if(ED&&t.id==='e_d')ED.desc=t.value;else if(ED&&t.id==='e_c')ED.cat=t.value;else if(ED&&t.id==='e_v')ED.vis=t.value;
else if(t.id==='x_q'){V.q=t.value;const p=t.selectionStart;go();const n=$('#x_q');n.focus();n.setSelectionRange(p,p)}else if(t.id==='x_c'){V.c=t.value;go()}
else if(t.dataset.a==='tg'){const r=DB.routines.find(x=>x.id===t.dataset.r&&x.owner===DB.session);if(r){r.acts[+t.dataset.i].on=t.checked;save();t.closest('.row').classList.toggle('on',t.checked)}}
else if(t.id&&t.id[0]==='s'&&t.id[1]==='_'){const s=me().set=S();s.h24=$('#s_f').value=='24';s.sound=$('#s_s').checked;s.tone=$('#s_t').value;s.vib=$('#s_v').checked;save()}});
// ---------- alarm engine
function initAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=S().tone;o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.4)}
function stopAlarm(){if(RING){RING.stop=true;RING.sd&&RING.sd.stop()}RING=null;$('#ov').style.display='none';navigator.vibrate&&navigator.vibrate(0)}
async function ring(a){stopAlarm();const me_=RING={stop:false},s=S();$('#oa').textContent=a.name;$('#ov').style.display='grid';
try{if(window.Notification&&Notification.permission==='granted')new Notification('TIMORA – '+a.name,{body:a.time?fmt(a.time):'Test alarm'})}catch(e){}
for(let r=1;r<=a.rings&&!me_.stop;r++){$('#ot').textContent=(a.time?fmt(a.time)+' · ':'')+'Ring '+r+' of '+a.rings;const end=Date.now()+a.dur*1000;const sd=me_.sd=s.sound?await startSound(a):null;while(Date.now()<end&&!me_.stop){if(s.vib&&a.vib&&navigator.vibrate)navigator.vibrate([400,200,400]);await sleep(1000)}sd&&sd.stop();await sleep(1500)}
if(RING===me_)stopAlarm()}
function tick(){if(!me()||RING)return;const now=new Date(),nm=now.getHours()*60+now.getMinutes();for(const r of myR())for(const a of r.acts){if(!a.on||!a.time)continue;const d=(nm-mins(a.time)+1440)%1440;if(d>2)continue;const k=a.id+'|'+dk(new Date(now-d*6e4));if(DB.fired[k])continue;DB.fired[k]=1;const ks=Object.keys(DB.fired);if(ks.length>500)ks.slice(0,250).forEach(x=>delete DB.fired[x]);save();ring(a);return}}
setInterval(tick,1000);document.addEventListener('visibilitychange',tick);
// ---------- sounds, uploads, profile
const BI={default:'Default',chime:'Chime',bell:'Bell',pulse:'Pulse',siren:'Siren'};let UP=[],PF=null,UT=0,PVS=null;
const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open('timora',1);q.onupgradeneeded=()=>q.result.createObjectStore('audio',{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const tx=async(m,f)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('audio',m),r=f(t.objectStore('audio'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)})};
const loadUP=async()=>{try{UP=(await tx('readonly',s=>s.getAll())).filter(x=>x.owner===DB.session)}catch(e){UP=[]}};
const delAudioFor=async id=>{try{for(const x of (await tx('readonly',s=>s.getAll())).filter(x=>x.owner===id))await tx('readwrite',s=>s.delete(x.id))}catch(e){}};
function mkUname(em){const b=(em.split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g,'')||'user').slice(0,16).padEnd(3,'0');let n=b,k=1;while(DB.users.some(x=>x.username===n))n=b+(k++);return n}
DB.users.forEach(u=>{if(!u.created)u.created=Date.now();if(!u.username)u.username=mkUname(u.email)});save();
function tn(f,t0,len,type,v,f2){if(!AC)return;const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+len);g.gain.setValueAtTime(Math.max(v,.002),t);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+len)}
function bi(id,v){if(id==='chime')[523,659,784].forEach((f,i)=>tn(f,i*.22,.5,'sine',v));else if(id==='bell'){tn(660,0,1.1,'sine',v);tn(1320,0,.7,'sine',v*.5)}else if(id==='pulse'){tn(440,0,.18,'square',v*.6);tn(440,.3,.18,'square',v*.6)}else if(id==='siren')tn(600,0,.9,'sawtooth',v*.5,1000);else tn(880,0,.4,S().tone,v)}
async function startSound(a){initAudio();const v=Math.min(1,Math.max(0,(+(a.vol??80))/100)),id=String(a.sound||'default');let iv=null,au=null;const loop=k=>{const p=()=>bi(k,v*.5);p();iv=setInterval(p,k==='bell'?1400:1000)};
if(id.startsWith('up:')){const rec=UP.find(x=>x.id===id.slice(3));if(!rec){toast('Sound unavailable – using default');loop('default')}else{try{au=new Audio(URL.createObjectURL(rec.blob));au.loop=true;au.volume=v;await au.play()}catch(e){if(au){try{URL.revokeObjectURL(au.src)}catch(x){}}au=null;toast('Could not play file – using default');loop('default')}}}else loop(BI[id]?id:'default');
return{stop(){clearInterval(iv);if(au){au.pause();try{URL.revokeObjectURL(au.src)}catch(e){}au=null}}}}
const stopPv=()=>{PVS&&PVS.stop();PVS=null;clearTimeout(stopPv.t)};
const srow=a=>`<select data-k="sound" title="Sound"><optgroup label="Built-in">${Object.entries(BI).map(([k,n])=>`<option value="${k}" ${(a.sound||'default')==k?'selected':''}>${n}</option>`).join('')}</optgroup>${UP.length?`<optgroup label="My uploads">${UP.map(x=>`<option value="up:${x.id}" ${a.sound=='up:'+x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>`:''}</select><label>Vol <input type="range" data-k="vol" min="0" max="100" value="${+(a.vol??80)}"></label><button data-a="pv">▶ Preview</button><button data-a="ps">■ Stop</button><button data-a="upl">Upload</button><button data-a="sr">Reset</button>`;
const av=(u,z)=>u.avatar&&/^data:image\/(webp|jpeg|png);base64,/.test(u.avatar)?`<img src="${u.avatar}" alt="" style="width:${z}px;height:${z}px;border-radius:50%;object-fit:cover;border:2px solid var(--line)">`:`<div style="width:${z}px;height:${z}px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-size:${Math.round(z/2.2)}px;font-weight:700">${esc((u.name||'?')[0].toUpperCase())}</div>`;
V.profile=()=>{const u=me(),ed=!!PF,p=PF||u;return`<div class="card"><div class="r1" style="gap:16px">${av(ed?{...u,avatar:PF.avatar}:u,96)}<div style="flex:1;min-width:0"><h2 style="margin:0">${esc(u.name)}</h2><div class="m">@${esc(u.username)} · Joined ${new Date(u.created).toLocaleDateString()}</div><div class="m">${esc(u.email)} (private)</div></div></div>${ed?`<div class="bar"><button data-a="pup">Upload photo</button><button data-a="prm">Remove photo</button></div><label>Display name<input class="in" id="p_n" maxlength="40" value="${esc(p.name)}"></label><label>Username<input class="in" id="p_u" maxlength="20" value="${esc(p.username)}"></label><label>Bio<textarea id="p_b" maxlength="200" rows="3">${esc(p.bio||'')}</textarea></label><div class="bar"><button class="p" data-a="psv">Save</button><button data-a="pcx">Cancel</button></div>`:`<p>${esc(u.bio||'No bio yet.')}</p><button class="p" data-a="pedit">Edit profile</button>`}</div><div class="card"><h3>My public routines</h3>${myR().filter(r=>r.vis=='public').map(r=>rc(r,1)).join('')||'<p class="m">None yet.</p>'}</div>`};
V.user=id=>{const o=user(id);if(!o)return'<div class="card">User not found.</div>';return`<div class="card"><div class="r1" style="gap:16px">${av(o,80)}<div><h2 style="margin:0">${esc(o.name)}</h2><div class="m">@${esc(o.username)} · Joined ${new Date(o.created).toLocaleDateString()}</div></div></div><p>${esc(o.bio||'')}</p></div><div class="g">${DB.routines.filter(r=>r.owner===id&&r.vis==='public').map(r=>rc(r)).join('')}</div>`};
const _st=V.settings;V.settings=()=>_st()+`<div class="card"><h3>My uploaded sounds</h3>${UP.map(x=>`<div class="lr"><span>${esc(x.name)}</span><button data-a="udel" data-id="${x.id}">Delete</button></div>`).join('')||'<p class="m">None yet. Upload from an activity’s sound controls.</p>'}</div>`;
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,row=b.closest('[data-i]'),i=row?+row.dataset.i:0;
if(a==='nav')stopPv();else if(a==='pv'&&ED){stopPv();PVS=await startSound(ED.acts[i]);clearTimeout(stopPv.t);stopPv.t=setTimeout(stopPv,5000)}else if(a==='ps')stopPv();else if(a==='upl'){UT=i;$('#upf').click()}
else if(a==='sr'&&ED){stopPv();ED.acts[i].sound='default';ED.acts[i].vol=80;go()}
else if(a==='udel'){try{await tx('readwrite',s=>s.delete(b.dataset.id));UP=UP.filter(x=>x.id!==b.dataset.id);toast('Sound deleted – activities using it fall back to default');go()}catch(x){toast('Delete failed')}}
else if(a==='pedit'){const u=me();PF={name:u.name,username:u.username,bio:u.bio||'',avatar:u.avatar||''};go()}
else if(a==='pup'&&PF)$('#pf').click();else if(a==='prm'&&PF){PF.avatar='';go()}else if(a==='pcx'){PF=null;go()}
else if(a==='psv'&&PF){const u=me(),p=PF,nm=p.name.trim().slice(0,40),un=p.username.trim().toLowerCase();if(!nm)return toast('Display name is required');if(!/^[a-z0-9_]{3,20}$/.test(un))return toast('Username: 3–20 letters, numbers or _');if(DB.users.some(x=>x.id!==u.id&&x.username===un))return toast('Username already taken');Object.assign(u,{name:nm,username:un,bio:p.bio.slice(0,200),avatar:p.avatar||''});save();PF=null;toast('Profile saved');go()}});
document.addEventListener('input',e=>{const t=e.target;if(!PF)return;if(t.id==='p_n')PF.name=t.value;else if(t.id==='p_u')PF.username=t.value;else if(t.id==='p_b')PF.bio=t.value});
$('#upf').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f||!ED||!me())return;
if(!(/^audio\/(mpeg|mp3|wav|x-wav|wave|ogg|webm|mp4|x-m4a|aac|flac)$/.test(f.type)||/\.(mp3|wav|ogg|m4a|aac)$/i.test(f.name)))return toast('Unsupported format. Use MP3, WAV, OGG, M4A or AAC.');if(f.size>3145728)return toast('File too large (max 3 MB)');if(UP.length>=20)return toast('Upload limit reached (20 sounds)');
const url=URL.createObjectURL(f),au=new Audio(),ok=await new Promise(r=>{au.onloadedmetadata=()=>r(au.duration>0&&au.duration<=120);au.onerror=()=>r(false);setTimeout(()=>r(false),5000);au.src=url});URL.revokeObjectURL(url);if(!ok)return toast('Cannot play this file (unsupported, corrupt or over 2 minutes)');
const rec={id:uid(),owner:DB.session,name:f.name.slice(0,60),blob:f};try{await tx('readwrite',s=>s.put(rec));UP.push(rec);ED.acts[UT].sound='up:'+rec.id;toast('Sound uploaded');go()}catch(x){toast('Could not store file')}});
$('#pf').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f||!PF)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type))return toast('Use a JPG, PNG or WEBP image');if(f.size>5242880)return toast('Image too large (max 5 MB)');
try{const bm=await createImageBitmap(f),s=Math.min(bm.width,bm.height),c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(bm,(bm.width-s)/2,(bm.height-s)/2,s,s,0,0,256,256);let d=c.toDataURL('image/webp',.82);if(d.indexOf('data:image/webp')!==0)d=c.toDataURL('image/jpeg',.85);PF.avatar=d;go()}catch(x){toast('Could not read this image')}});
// ---------- automatic online / offline mode
let ONL=navigator.onLine!==false,PROBE=false;
const offMsg=t=>`<div class="card"><h2>${t}</h2><p class="m">You’re in Offline Mode. This section needs an internet connection and returns automatically when you reconnect. Dashboard, routines, templates, profile, settings and alarms keep working.</p><button data-a="nav" data-t="routines">Go to My routines</button></div>`;
const _ex=V.explore,_vw=V.view,_us=V.user;
V.explore=()=>ONL?_ex():offMsg('Explore is unavailable offline');
V.view=id=>{const r=DB.routines.find(x=>x.id===id);return(!ONL&&r&&r.owner!==DB.session)?offMsg('This shared routine is unavailable offline'):_vw(id)};
V.user=id=>(ONL||id===DB.session)?_us(id):offMsg('Public profiles are unavailable offline');
function setNet(on,quiet){const ch=ONL!==on;ONL=on;const n=$('#net');n.className='net'+(on?'':' off');n.lastChild.textContent=on?'Online':'Offline Mode';n.title=on?'Connected':'No connection – local features still work';document.querySelectorAll('#nav [data-t=explore]').forEach(b=>{b.style.opacity=on?'':'.5';b.title=on?'':'Unavailable offline'});
if(ch){if(!quiet)toast(on?'Back online – Explore is available':'You’re offline – local features keep working');if(/^(explore|view|user)/.test((location.hash||'').slice(1)))go()}}
async function probe(){if(navigator.onLine===false)return false;let t;try{const c=new AbortController();t=setTimeout(()=>c.abort(),4000);await fetch(location.href.split('#')[0],{method:'HEAD',cache:'no-store',signal:c.signal});clearTimeout(t);PROBE=true;return true}catch(e){clearTimeout(t);return PROBE?false:true}}
const chk=async()=>setNet(await probe());
addEventListener('online',chk);addEventListener('offline',()=>setNet(false));document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()});setInterval(chk,15000);
setNet(ONL,true);chk();
loadUP().then(go);
if(!location.hash)location.hash=me()?'home':'auth';go();
